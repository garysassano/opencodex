name: Service lifecycle

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "src/service.ts"
      - "src/service/**"
      # Keep in sync with the release.yml service-gate regex (release.yml "Require
      # successful Cross-platform CI" step). src/cli.ts is the pre-restructure compat
      # stub that durable launchers still execute.
      - "src/cli.ts"
      - "src/cli/index.ts"
      - "src/config/process-state.ts"
      - "src/lib/bun-runtime.ts"
      - "src/lib/package-tree-integrity.ts"
      - "bin/ocx.mjs"
      - ".github/scripts/mise-service-fixture-registry.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/service-lifecycle.yml"
      # release.yml gates on THIS workflow having run for the release SHA. A release-branch
      # commit that touches only release.yml (e.g. the v2.40.0 permissions carry, #3263/#3264)
      # produced no run and the gate dead-ended until a manual dispatch.
      - ".github/workflows/release.yml"
  push:
    paths:
      - "src/service.ts"
      - "src/service/**"
      # Keep in sync with the release.yml service-gate regex (see above).
      - "src/cli.ts"
      - "src/cli/index.ts"
      - "src/config/process-state.ts"
      - "src/lib/bun-runtime.ts"
      - "src/lib/package-tree-integrity.ts"
      - "bin/ocx.mjs"
      - ".github/scripts/mise-service-fixture-registry.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/service-lifecycle.yml"
      # release.yml gates on THIS workflow having run for the release SHA. A release-branch
      # commit that touches only release.yml (e.g. the v2.40.0 permissions carry, #3263/#3264)
      # produced no run and the gate dead-ended until a manual dispatch.
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-systemd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-project-bun
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.9.11
          install: false
          cache: false

      - run: bun install --frozen-lockfile

      # systemd user session needs XDG_RUNTIME_DIR
      - name: Enable systemd user session
        run: |
          sudo loginctl enable-linger "$(whoami)"
          user_id="$(id -u)"
          export XDG_RUNTIME_DIR="/run/user/${user_id}"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"

      # Write a minimal config so ocx start doesn't fail on missing providers
      - name: Write minimal config
        run: |
          mkdir -p ~/.opencodex
          echo '{"port":10199,"providers":{},"clientIntegrations":{"codex":false}}' > ~/.opencodex/config.json

      - name: Install service
        run: bun run src/cli/index.ts service install

      - name: Verify service is running
        run: |
          ready=false
          for attempt in $(seq 1 20); do
            if systemctl --user is-active --quiet opencodex-proxy \
              && curl --max-time 2 -sf http://127.0.0.1:10199/healthz >/dev/null; then
              ready=true
              break
            fi
            echo "waiting for systemd service health ($attempt/20)"
            sleep 1
          done
          if [ "$ready" != true ]; then
            systemctl --user status opencodex-proxy --no-pager || true
            journalctl --user-unit opencodex-proxy --no-pager -n 200 || true
            echo "::error::systemd service did not become healthy"
            exit 1
          fi

      - name: Verify mise-owned package refresh
        run: |
          set -euo pipefail
          fixture_root="$(mktemp -d)"
          registry_pid=""
          cleanup() {
            if [ -n "$registry_pid" ]; then kill "$registry_pid" 2>/dev/null || true; fi
            rm -rf "$fixture_root"
          }
          trap cleanup EXIT
          mkdir -p "$fixture_root/packages"

          for version in 90.0.1 90.0.2; do
            package_root="$fixture_root/package-$version"
            mkdir -p "$package_root"
            git archive HEAD | tar -x -C "$package_root"
            jq --arg version "$version" '.version = $version' "$package_root/package.json" > "$package_root/package.json.next"
            mv "$package_root/package.json.next" "$package_root/package.json"
            npm pack --ignore-scripts --pack-destination "$fixture_root/packages" "$package_root" >/dev/null
          done

          bun .github/scripts/mise-service-fixture-registry.ts "$fixture_root/packages" > "$fixture_root/registry.log" 2>&1 &
          registry_pid=$!
          for attempt in $(seq 1 20); do
            if curl --max-time 2 -sf http://127.0.0.1:4873/%40bitkyc08%2Fopencodex >/dev/null; then break; fi
            if [ "$attempt" = 20 ]; then cat "$fixture_root/registry.log"; exit 1; fi
            sleep 1
          done

          export MISE_DATA_DIR="$fixture_root/mise-data"
          export MISE_CACHE_DIR="$fixture_root/mise-cache"
          export MISE_CONFIG_DIR="$fixture_root/mise-config"
          export MISE_GLOBAL_CONFIG_FILE="$MISE_CONFIG_DIR/config.toml"
          export NPM_CONFIG_REGISTRY=http://127.0.0.1:4873
          system_node_dir="$(dirname "$(command -v node)")"
          mise_bin_dir="$(dirname "$(command -v mise)")"
          export PATH="$system_node_dir:$mise_bin_dir:$MISE_DATA_DIR/shims:/usr/local/bin:/usr/bin:/bin"
          mkdir -p "$MISE_CONFIG_DIR"
          printf '[tools]\nopencodex = { version = "90.0.1", allow_builds = ["bun"] }\n\n[tool_alias]\nopencodex = "npm:@bitkyc08/opencodex"\n' > "$MISE_CONFIG_DIR/config.toml"
          mise install opencodex@90.0.1
          mise reshim

          ocx service repair
          pid_a="$(jq -r .pid "$HOME/.opencodex/runtime-port.json")"
          no_change="$(ocx service restart --if-needed --json)"
          test "$(jq -r .action <<<"$no_change")" = unchanged
          test "$(jq -r .pid <<<"$no_change")" = "$pid_a"

          mise use --global --pin opencodex@90.0.2
          changed="$(mise exec -- ocx service restart --if-needed --json)"
          pid_b="$(jq -r .pid <<<"$changed")"
          test "$(jq -r .action <<<"$changed")" = restarted
          test "$pid_b" != "$pid_a"
          test "$(curl --max-time 2 -sf http://127.0.0.1:10199/healthz | jq -r .version)" = 90.0.2

          repeated="$(mise exec -- ocx service restart --if-needed --json)"
          test "$(jq -r .action <<<"$repeated")" = unchanged
          test "$(jq -r .pid <<<"$repeated")" = "$pid_b"

          mise install --force opencodex@90.0.2
          mise reshim
          reinstalled="$(mise exec -- ocx service restart --if-needed --json)"
          pid_reinstalled="$(jq -r .pid <<<"$reinstalled")"
          test "$(jq -r .action <<<"$reinstalled")" = restarted
          test "$pid_reinstalled" != "$pid_b"

          mise install --force opencodex@90.0.2
          mise reshim
          mise exec -- ocx service restart --if-needed --json > "$fixture_root/refresh-one.json" &
          refresh_one_pid=$!
          mise exec -- ocx service restart --if-needed --json > "$fixture_root/refresh-two.json" &
          refresh_two_pid=$!
          wait "$refresh_one_pid"
          wait "$refresh_two_pid"
          jq -e -s 'map(.action) | sort == ["restarted", "unchanged"]' \
            "$fixture_root/refresh-one.json" "$fixture_root/refresh-two.json"

      - name: ocx stop should stop the service too
        run: |
          bun run src/cli/index.ts stop
          stopped=false
          for attempt in $(seq 1 10); do
            if ! systemctl --user is-active --quiet opencodex-proxy \
              && ! curl --max-time 2 -sf http://127.0.0.1:10199/healthz >/dev/null; then
              stopped=true
              break
            fi
            echo "waiting for systemd service stop ($attempt/10)"
            sleep 1
          done
          if [ "$stopped" != true ]; then
            systemctl --user status opencodex-proxy --no-pager || true
            journalctl --user-unit opencodex-proxy --no-pager -n 200 || true
            echo "::error::service or health endpoint survived ocx stop"
            exit 1
          fi

      - name: Restart service and verify crash-restart
        run: |
          bun run src/cli/index.ts service start
          old_pid="$(systemctl --user show opencodex-proxy --property MainPID --value)"
          case "$old_pid" in
            ""|0|*[!0-9]*)
              echo "::error::systemd service has no positive MainPID before crash test"
              exit 1
              ;;
          esac
          kill -9 "$old_pid"

          restarted=false
          for attempt in $(seq 1 20); do
            new_pid="$(systemctl --user show opencodex-proxy --property MainPID --value 2>/dev/null || true)"
            if systemctl --user is-active --quiet opencodex-proxy \
              && [ -n "$new_pid" ] \
              && [ "$new_pid" != 0 ] \
              && [ "$new_pid" != "$old_pid" ] \
              && curl --max-time 2 -sf http://127.0.0.1:10199/healthz >/dev/null; then
              restarted=true
              break
            fi
            echo "waiting for systemd crash restart ($attempt/20)"
            sleep 1
          done
          if [ "$restarted" != true ]; then
            systemctl --user status opencodex-proxy --no-pager || true
            journalctl --user-unit opencodex-proxy --no-pager -n 200 || true
            echo "::error::systemd service did not restart healthy with a new MainPID"
            exit 1
          fi

      - name: Uninstall service
        if: ${{ !cancelled() }}
        run: |
          bun run src/cli/index.ts service uninstall
          removed=false
          for attempt in $(seq 1 10); do
            if [ ! -e "$HOME/.config/systemd/user/opencodex-proxy.service" ] \
              && ! systemctl --user is-active --quiet opencodex-proxy \
              && ! curl --max-time 2 -sf http://127.0.0.1:10199/healthz >/dev/null; then
              removed=true
              break
            fi
            echo "waiting for systemd uninstall cleanup ($attempt/10)"
            sleep 1
          done
          if [ "$removed" != true ]; then
            systemctl --user status opencodex-proxy --no-pager || true
            journalctl --user-unit opencodex-proxy --no-pager -n 200 || true
            echo "::error::systemd artifact or proxy survived uninstall"
            exit 1
          fi

  macos-launchd:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-project-bun

      - run: bun install --frozen-lockfile

      - name: Write minimal config
        run: |
          mkdir -p ~/.opencodex
          echo '{"port":10199,"providers":{}}' > ~/.opencodex/config.json

      - name: Install service
        run: bun run src/cli/index.ts service install

      - name: Verify launchd service is healthy
        run: |
          ready=false
          for attempt in $(seq 1 20); do
            if launchctl list | grep -q com.opencodex.proxy \
              && curl --max-time 2 -sf http://127.0.0.1:10199/healthz >/dev/null; then
              ready=true
              break
            fi
            echo "waiting for launchd service health ($attempt/20)"
            sleep 1
          done
          if [ "$ready" != true ]; then
            launchctl list | grep com.opencodex.proxy || true
            tail -n 200 "$HOME/.opencodex/service.log" || true
            echo "::error::launchd service did not become healthy"
            exit 1
          fi

      - name: ocx stop should unload the agent
        run: |
          bun run src/cli/index.ts stop
          stopped=false
          for attempt in $(seq 1 10); do
            if ! launchctl list | grep -q com.opencodex.proxy \
              && ! curl --max-time 2 -sf http://127.0.0.1:10199/healthz >/dev/null; then
              stopped=true
              break
            fi
            echo "waiting for launchd service stop ($attempt/10)"
            sleep 1
          done
          if [ "$stopped" != true ]; then
            launchctl list | grep com.opencodex.proxy || true
            tail -n 200 "$HOME/.opencodex/service.log" || true
            echo "::error::launchd label or health endpoint survived ocx stop"
            exit 1
          fi

      - name: Uninstall service
        if: ${{ !cancelled() }}
        run: |
          bun run src/cli/index.ts service uninstall
          removed=false
          for attempt in $(seq 1 10); do
            if [ ! -e "$HOME/Library/LaunchAgents/com.opencodex.proxy.plist" ] \
              && ! launchctl list | grep -q com.opencodex.proxy \
              && ! curl --max-time 2 -sf http://127.0.0.1:10199/healthz >/dev/null; then
              removed=true
              break
            fi
            echo "waiting for launchd uninstall cleanup ($attempt/10)"
            sleep 1
          done
          if [ "$removed" != true ]; then
            launchctl list | grep com.opencodex.proxy || true
            tail -n 200 "$HOME/.opencodex/service.log" || true
            echo "::error::launchd artifact or proxy survived uninstall"
            exit 1
          fi

  windows-schtasks:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-project-bun

      - run: bun install --frozen-lockfile

      - name: Write minimal config
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.opencodex" | Out-Null
          Set-Content -Path "$env:USERPROFILE\.opencodex\config.json" -Value '{"port":10199,"providers":{}}'

      - name: Install service
        shell: pwsh
        run: bun run src/cli/index.ts service install

      - name: Verify scheduled task is healthy
        shell: pwsh
        run: |
          $ready = $false
          for ($attempt = 1; $attempt -le 20; $attempt++) {
            $task = Get-ScheduledTask -TaskName opencodex-proxy -ErrorAction SilentlyContinue
            $healthy = $false
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:10199/healthz -TimeoutSec 2
              $healthy = $response.StatusCode -eq 200
            } catch {}
            if ($null -ne $task -and $task.State -eq "Running" -and $healthy) {
              $ready = $true
              break
            }
            Write-Host "waiting for scheduled task health ($attempt/20)"
            Start-Sleep -Seconds 1
          }
          if (-not $ready) {
            Get-ScheduledTask -TaskName opencodex-proxy -ErrorAction SilentlyContinue | Format-List *
            Get-Content "$env:USERPROFILE\.opencodex\service.log" -Tail 200 -ErrorAction SilentlyContinue
            throw "scheduled task did not become healthy"
          }

      - name: ocx stop should end the task
        shell: pwsh
        run: |
          bun run src/cli/index.ts stop
          $stopped = $false
          for ($attempt = 1; $attempt -le 10; $attempt++) {
            $task = Get-ScheduledTask -TaskName opencodex-proxy -ErrorAction SilentlyContinue
            $healthy = $false
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:10199/healthz -TimeoutSec 2
              $healthy = $response.StatusCode -eq 200
            } catch {}
            if ($null -ne $task -and $task.State -ne "Running" -and -not $healthy) {
              $stopped = $true
              break
            }
            Write-Host "waiting for scheduled task stop ($attempt/10)"
            Start-Sleep -Seconds 1
          }
          if (-not $stopped) {
            Get-ScheduledTask -TaskName opencodex-proxy -ErrorAction SilentlyContinue | Format-List *
            Get-Content "$env:USERPROFILE\.opencodex\service.log" -Tail 200 -ErrorAction SilentlyContinue
            throw "scheduled task or health endpoint survived ocx stop"
          }

      - name: Uninstall service
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          bun run src/cli/index.ts service uninstall
          $removed = $false
          for ($attempt = 1; $attempt -le 10; $attempt++) {
            $task = Get-ScheduledTask -TaskName opencodex-proxy -ErrorAction SilentlyContinue
            $healthy = $false
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:10199/healthz -TimeoutSec 2
              $healthy = $response.StatusCode -eq 200
            } catch {}
            if ($null -eq $task -and -not $healthy) {
              $removed = $true
              break
            }
            Write-Host "waiting for scheduled task uninstall cleanup ($attempt/10)"
            Start-Sleep -Seconds 1
          }
          if (-not $removed) {
            Get-ScheduledTask -TaskName opencodex-proxy -ErrorAction SilentlyContinue | Format-List *
            Get-Content "$env:USERPROFILE\.opencodex\service.log" -Tail 200 -ErrorAction SilentlyContinue
            throw "scheduled task or proxy survived uninstall"
          }
